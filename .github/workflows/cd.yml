name: CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Incrementar versión
        run: |
          echo "AppVersion-1" >> README.md
          echo "Fecha: $(date)" >> README.md

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Incrementar versión" || echo "Sin cambios"
          git push

  validate-prod:
    needs: update-version
    runs-on: self-hosted

    steps:
      - name: Validar PROD_TOKEN
        shell: powershell
        run: |
          if ("${{ secrets.PROD_TOKEN }}" -ne "$env:LOCAL_PROD_TOKEN") {
            Write-Error "PROD_TOKEN no coincide"
            exit 1
          }
          Write-Host "PROD_TOKEN coincide correctamente"
